version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_transparencia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: ${DB_NAME:?Define DB_NAME in the root .env file}
      MYSQL_USER: ${DB_USER:?Define DB_USER in the root .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the root .env file}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
