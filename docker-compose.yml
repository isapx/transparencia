version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_transparencia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Perroloco48$
      MYSQL_DATABASE: transparencia_etchojoa
      MYSQL_USER: transparencia_user
      MYSQL_PASSWORD: Computadora358&&
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
